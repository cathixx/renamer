version: 2

# All updates (Gradle and GitHub Actions, including major versions) are combined into one weekly pull request.
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "weekly"

updates:
  # Gradle: dependencies, plugins and the Gradle wrapper
  - package-ecosystem: "gradle"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    ignore:
      # served from the local file repository in ./repo, not resolvable by Dependabot
      - dependency-name: "de.cathixx:*"

  # GitHub Actions used in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
