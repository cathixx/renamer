plugins {
    id 'application'
    id 'idea'
    id 'eclipse'
    alias(libs.plugins.lombok)
    alias(libs.plugins.javafx)
}

group = 'de.cathixx'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

javafx {
    // single source for the JavaFX version: gradle/libs.versions.toml
    version = libs.versions.javafx.get()
    modules = [ 'javafx.controls', 'javafx.fxml' ]
}

repositories {
    mavenCentral()
}

dependencies {
    implementation libs.themoviedbapi
    implementation libs.slf4j.api
    // themoviedbapi classes are annotated with Jackson annotations, which are only on its runtime classpath
    compileOnly libs.jackson.annotations

    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher

    runtimeOnly platform(libs.log4j.bom)
    runtimeOnly libs.bundles.log4j

    // include the native JavaFX binaries of all platforms in the jar
    // (mac-aarch64 can't be added: its native libraries have the same file names as the mac x64 ones)
    ['win', 'linux', 'mac'].each { platform ->
        runtimeOnly(variantOf(libs.javafx.graphics) { classifier(platform) })
    }
}

test {
    useJUnitPlatform()
}

// TMDB API key, embedded into the jar as resource (read by ApiKeyProvider)
// - CI: environment variable TMDB_API_KEY (repository secret)
// - local development: TMDB_API_KEY in the .env file (not committed, see .env.example)
def tmdbApiKey = providers.environmentVariable('TMDB_API_KEY')
        .orElse(providers.fileContents(layout.projectDirectory.file('.env')).asText.map { readDotEnv(it, 'TMDB_API_KEY') })
        .filter { !it.isBlank() }

static String readDotEnv(String content, String name) {
    content.readLines()
            .collect { it.trim() }
            .findAll { it && !it.startsWith('#') && it.contains('=') }
            .collectEntries { line ->
                def (key, value) = line.split('=', 2)
                [(key.trim()): value.trim().replaceAll(/^["']|["']$/, '')]
            }[name]
}

def generateApiKeys = tasks.register('generateApiKeys') {
    description = 'Writes the API keys into a resource file that is embedded into the jar.'
    def apiKey = tmdbApiKey.orElse('')
    def outputDir = layout.buildDirectory.dir('generated/resources/apikeys')
    inputs.property('tmdbApiKey', apiKey)
    outputs.dir(outputDir)
    doLast {
        def file = outputDir.get().file('de/cathixx/renamer/apikeys.properties').asFile
        file.parentFile.mkdirs()
        file.text = "tmdb=${apiKey.get()}\n"
        if (apiKey.get().isEmpty()) {
            logger.warn('WARNING: no TMDB API key found (environment variable TMDB_API_KEY or .env), ' +
                    'the application will only work with a key provided at runtime')
        }
    }
}

sourceSets.main.resources.srcDir(generateApiKeys)

application {
    mainClass = 'de.cathixx.renamer.Launcher'
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveFileName = 'renamer.jar'
    manifest {
        attributes "Main-Class": application.mainClass.get()
        attributes 'Implementation-Version': archiveVersion.get()
        // JavaFX loads native libraries, avoid the JDK warning about restricted method calls
        attributes 'Enable-Native-Access': 'ALL-UNNAMED'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

clean {
    delete 'out'
}
