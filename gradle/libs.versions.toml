[versions]
javafx = "27.0.1"
junit = "6.1.3"
log4j = "2.26.1"

[libraries]
themoviedbapi = { module = "uk.co.conoregan:themoviedbapi", version = "3.1.0" }
slf4j-api = { module = "org.slf4j:slf4j-api", version = "2.0.20" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version = "2.22" }

# JavaFX: the version is also used by the javafx plugin (see build.gradle)
javafx-graphics = { module = "org.openjfx:javafx-graphics", version.ref = "javafx" }

log4j-bom = { module = "org.apache.logging.log4j:log4j-bom", version.ref = "log4j" }
log4j-api = { module = "org.apache.logging.log4j:log4j-api" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core" }
log4j-slf4j2-impl = { module = "org.apache.logging.log4j:log4j-slf4j2-impl" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[bundles]
log4j = ["log4j-api", "log4j-core", "log4j-slf4j2-impl"]

[plugins]
lombok = { id = "io.freefair.lombok", version = "9.8.3" }
javafx = { id = "org.openjfx.javafxplugin", version = "0.1.0" }
